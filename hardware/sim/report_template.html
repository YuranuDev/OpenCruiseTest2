<style>
/* Layout: a bench-test notebook. Summary strip, then one section per test: purpose -> waveforms -> checks. */
:root{

  --accent:#2c57c9; --band:rgba(44,87,201,.07);
  --pass:#1d8458; --warn:#b26b0f; --fail:#c23b3b; --ref:#7a8496;
  --t1:#2c57c9; --t2:#d9601a; --t3:#16917a; --t4:#9b3fb5; --t5:#b8911a; --t6:#4c5566;
  --sans:"IBM Plex Sans JP","Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151c; --sheet:#181e27; --ink:#e4e8ef; --muted:#9aa3b3; --line:#2a323e; --grid:#232a35;
  --accent:#7c9cf2; --band:rgba(124,156,242,.10);
  --pass:#45c08a; --warn:#e3a33e; --fail:#ee6e6e; --ref:#8590a3;
  --t1:#7c9cf2; --t2:#f08c4e; --t3:#3fc2a6; --t4:#c983de; --t5:#dcbd4f; --t6:#a3adbd; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151c; --sheet:#181e27; --ink:#e4e8ef; --muted:#9aa3b3; --line:#2a323e; --grid:#232a35;
  --accent:#7c9cf2; --band:rgba(124,156,242,.10);
  --pass:#45c08a; --warn:#e3a33e; --fail:#ee6e6e; --ref:#8590a3;
  --t1:#7c9cf2; --t2:#f08c4e; --t3:#3fc2a6; --t4:#c983de; --t5:#dcbd4f; --t6:#a3adbd; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.65;margin:0}
.wrap{max-width:1080px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:28px}
h1{font-size:1.75rem;line-height:1.3;margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font-size:1.25rem;line-height:1.4;margin:0;text-wrap:balance}
h3{font-size:.8rem;margin:0;color:var(--muted);letter-spacing:.08em;font-weight:500}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sub{color:var(--muted);margin:4px 0 0}
header{display:grid;gap:18px}
.tally{display:flex;flex-wrap:wrap;gap:10px}
.tally div{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:8px 14px;display:flex;align-items:baseline;gap:8px}
.tally b{font-family:var(--mono);font-size:1.4rem;font-weight:500}
.chip{display:inline-block;font-family:var(--mono);font-size:.72rem;font-weight:500;letter-spacing:.06em;padding:1px 8px;border-radius:999px;border:1px solid currentColor;line-height:1.6;white-space:nowrap}
.PASS{color:var(--pass)} .WARN{color:var(--warn)} .FAIL{color:var(--fail)}
.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.map section{display:grid;gap:6px;align-content:start}
.map a{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:7px 10px;border-radius:6px;color:var(--ink);text-decoration:none;background:var(--sheet);border:1px solid var(--line);font-size:.88rem}
.map a:hover,.map a:focus-visible{border-color:var(--accent);outline:none}
.test{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:22px clamp(14px,3vw,28px);display:grid;gap:18px;scroll-margin-top:12px}
.test>.head{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.test>.head .file{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.intro{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px}
@media (max-width:720px){.intro{grid-template-columns:minmax(0,1fr)}}
.intro p{margin:0}
.intro>div{align-content:start}
.intro ol{margin:0;padding-left:1.3em;display:grid;gap:3px;font-size:.9rem}
.parts{font-size:.84rem;color:var(--muted)}
.chart{display:grid;gap:6px;min-width:0}
.chart .ttl{font-weight:500;font-size:.92rem}
.chart svg{display:block;width:100%;touch-action:pan-y;cursor:crosshair}
.legend{display:grid;gap:2px;font-size:.8rem}
.legend .row{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline}
.legend .pl{color:var(--muted);min-width:7.5em}
.legend .it{display:inline-flex;gap:5px;align-items:baseline;white-space:nowrap}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;transform:translateY(-3px)}
.legend .v{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.legend .tnow{font-family:var(--mono);color:var(--accent)}
.note{font-size:.78rem;color:var(--muted)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.84rem;min-width:560px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:500;color:var(--muted);font-size:.76rem;letter-spacing:.04em}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.verdict{border-left:3px solid var(--line);padding:4px 0 4px 14px;margin:0}
.verdict.PASS{border-color:var(--pass)} .verdict.WARN{border-color:var(--warn)} .verdict.FAIL{border-color:var(--fail)}
.verdict span{color:var(--ink)}
.howto{font-size:.88rem;color:var(--muted);margin:0}
.chart svg text{font-family:var(--mono);font-size:10.5px}
.schems{display:grid;gap:18px}
.schems>h2{margin-top:6px}
.blk{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:18px clamp(14px,3vw,24px);display:grid;gap:10px;scroll-margin-top:12px}
.blk .bh{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.blk h3{font-size:1.05rem;color:var(--ink);letter-spacing:0;font-weight:700}
.blk p{margin:0;font-size:.9rem;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{font:inherit;font-size:.8rem;padding:4px 12px;background:none;border:0;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.fig{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--sheet)}
.fig svg{display:block;width:100%;min-width:720px;height:auto;color:var(--ink)}
.fig img{display:block;width:100%;min-width:720px;height:auto;background:#fff;border-radius:4px}
.rel{font-size:.86rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.rel a{color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:2px 9px}
.rel a:hover,.rel a:focus-visible{border-color:var(--accent);outline:none}
.toc2{display:flex;flex-wrap:wrap;gap:8px}
.toc2 a{font-size:.86rem;color:var(--ink);text-decoration:none;background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:5px 10px}
.toc2 a:hover{border-color:var(--accent)}

@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}

<!--BODY-->
<div class="wrap">
  <header>
    <div>
      <h1>PWR-CTRL v2.4.1 SPICE検証</h1>
      <p class="sub">車載PC電源制御基板の回路図（ブロックごと）と、主要な動作をngspiceで再現した結果です。<span class="mono" id="date"></span></p>
    </div>
    <p class="howto"><b style="color:var(--ink)">v2.4.1の変更</b>（このSPICEの結果を受けて）：R80〜R84 100Ω→<b style="color:var(--ink)">1kΩ</b>（GPIOの誤配線保護）、R30/R31 2.2k→<b style="color:var(--ink)">1.2kΩ</b>（I2C 400kHz）、C41 1µF→<b style="color:var(--ink)">10µF/50V X7R</b>（U8の入力リップル）。</p>
    <div class="tally" id="tally"></div>
    <p class="howto">グラフの上でマウスを動かす（スマホはタップ）と、その時刻の各波形の値が凡例に表示されます。点線は合否の基準、帯は試験のシナリオの区間です。</p>
    <div class="map" id="map"></div>
    <div><h3 style="margin-bottom:8px">回路図（ブロックごと）</h3><nav class="toc2" id="toc2"></nav></div>
  </header>
  <section class="schems" id="schem"></section>
  <main id="tests" style="display:grid;gap:28px"></main>
</div>
<script>
const DATA = /*__DATA__*/null;
const $ = (t, a = {}, ...kids) => { const e = document.createElement(t); for (const [k, v] of Object.entries(a)) { if (k === 'class') e.className = v; else if (k === 'html') e.innerHTML = v; else e.setAttribute(k, v); } for (const k of kids) e.append(k); return e; };
const NS = 'http://www.w3.org/2000/svg';
const S = (t, a = {}) => { const e = document.createElementNS(NS, t); for (const [k, v] of Object.entries(a)) e.setAttribute(k, v); return e; };
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmt = (v, d = 3) => { if (v == null || !isFinite(v)) return '—'; const a = Math.abs(v); if (a >= 1000) return v.toFixed(0); if (a >= 100) return v.toFixed(1); if (a >= 10) return v.toFixed(2); if (a >= 0.01 || a === 0) return v.toFixed(3); return v.toExponential(2); };
const JP = { PASS: '合格', WARN: '要注意', FAIL: '不合格' };
const chip = s => $('span', { class: 'chip ' + s }, JP[s]);

function niceTicks(lo, hi, n) {
  const span = hi - lo, step0 = span / n, mag = 10 ** Math.floor(Math.log10(step0));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => span / s <= n) || 10 * mag;
  const out = []; for (let v = Math.ceil(lo / step) * step; v <= hi + step * 1e-6; v += step) out.push(+v.toFixed(10)); return out;
}
function bsearch(xs, x) { let a = 0, b = xs.length - 1; while (b - a > 1) { const m = (a + b) >> 1; if (xs[m] < x) a = m; else b = m; } return (x - xs[a] < xs[b] - x) ? a : b; }

const charts = [];
function drawChart(host, ch) {
  host.innerHTML = '';
  const W = Math.max(300, host.clientWidth), narrow = W < 560;
  const ML = narrow ? 40 : 48, MR = 10, PH = narrow ? 120 : 150, GAP = 10;
  const hasLab = ch.events.length || ch.marks.some(m => m.t != null), TOP = (ch.bands.length ? 14 : 0) + (hasLab ? 38 : 0) + 8, BOT = 30;
  const H = TOP + ch.panels.length * (PH + GAP) - GAP + BOT;
  let xmin = ch.xmin, xmax = ch.xmax;
  if (xmin == null) { xmin = Infinity; xmax = -Infinity; for (const p of ch.panels) for (const t of p.traces) { xmin = Math.min(xmin, t.x[0]); xmax = Math.max(xmax, t.x[t.x.length - 1]); } }
  const X = v => ML + (v - xmin) / (xmax - xmin) * (W - ML - MR);
  const svg = S('svg', { viewBox: `0 0 ${W} ${H}`, height: H, role: 'img', 'aria-label': ch.title });
  const defs = S('defs'); svg.append(defs);
  const ink = css('--ink'), muted = css('--muted'), grid = css('--grid'), line = css('--line');
  const kindCol = { ng: css('--fail'), warn: css('--warn'), ref: css('--ref') };
  const colors = ['--t1', '--t2', '--t3', '--t4', '--t5', '--t6'].map(css);
  // bands (all panels)
  const yTop = TOP, yBot = TOP + ch.panels.length * (PH + GAP) - GAP;
  for (const b of ch.bands) {
    const x0 = Math.max(ML, X(b.t0)), x1 = Math.min(W - MR, X(b.t1)); if (x1 <= x0) continue;
    svg.append(S('rect', { x: x0, y: yTop, width: x1 - x0, height: yBot - yTop, fill: css('--band') }));
    const t = S('text', { x: x0 + 3, y: 11, fill: css('--accent') }); t.textContent = b.label; svg.append(t);
  }
  const lab = [];
  ch.events.forEach((e, i) => { if (e.t < xmin || e.t > xmax) return; const x = X(e.t);
    svg.append(S('line', { x1: x, x2: x, y1: yTop - 4, y2: yBot, stroke: muted, 'stroke-dasharray': '2 3', 'stroke-width': 1 }));
    lab.push({ x, text: e.label, col: muted }); });
  ch.marks.filter(m => m.t != null).forEach(m => { if (m.t < xmin || m.t > xmax) return; const x = X(m.t);
    svg.append(S('line', { x1: x, x2: x, y1: yTop - 4, y2: yBot, stroke: css('--accent'), 'stroke-width': 1.2 }));
    lab.push({ x, text: '▼ ' + m.label, col: css('--accent') }); });
  // stagger labels on two rows
  lab.sort((a, b) => a.x - b.x); const rowEnd = [-1e9, -1e9, -1e9];
  const tw = s => [...s].reduce((a, c) => a + (c.charCodeAt(0) > 255 ? 10.5 : 6.4), 0) + 8;
  for (const l of lab) { const w = tw(l.text); let x = l.x + 3; if (x + w > W - MR) x = l.x - w;
    let r = rowEnd.findIndex(e => e < x); if (r < 0) r = rowEnd.indexOf(Math.min(...rowEnd)); rowEnd[r] = x + w;
    const t = S('text', { x, y: (ch.bands.length ? 25 : 11) + r * 12, fill: l.col }); t.textContent = l.text; svg.append(t); }
  const panels = [];
  ch.panels.forEach((p, pi) => {
    const y0 = TOP + pi * (PH + GAP), y1 = y0 + PH;
    let lo = p.ymin, hi = p.ymax;
    if (lo == null) { lo = Infinity; hi = -Infinity; for (const t of p.traces) for (const v of t.y) { lo = Math.min(lo, v); hi = Math.max(hi, v); } const pad = (hi - lo) * .08 || 1; lo -= pad; hi += pad; }
    const Y = v => y1 - (v - lo) / (hi - lo) * PH;
    svg.append(S('rect', { x: ML, y: y0, width: W - ML - MR, height: PH, fill: 'none', stroke: line }));
    for (const v of niceTicks(lo, hi, narrow ? 3 : 4)) { const y = Y(v);
      svg.append(S('line', { x1: ML, x2: W - MR, y1: y, y2: y, stroke: grid }));
      const t = S('text', { x: ML - 5, y: y + 3.5, 'text-anchor': 'end', fill: muted }); t.textContent = v; svg.append(t); }
    const id = 'c' + Math.random().toString(36).slice(2);
    const cp = S('clipPath', { id }); cp.append(S('rect', { x: ML, y: y0, width: W - ML - MR, height: PH })); defs.append(cp);
    const g = S('g', { 'clip-path': `url(#${id})` }); svg.append(g);
    const placed = [];
    for (const L of p.limits || []) { const y = Y(L.y); if (y < y0 || y > y1) continue;
      g.append(S('line', { x1: ML, x2: W - MR, y1: y, y2: y, stroke: kindCol[L.kind], 'stroke-dasharray': '6 4', 'stroke-width': 1.2 }));
      let xr = W - MR - 4; while (placed.some(q => Math.abs(q.y - y) < 12 && q.x === xr)) xr -= narrow ? 120 : 170;
      placed.push({ x: xr, y });
      const t = S('text', { x: xr, y: y - 4, 'text-anchor': 'end', fill: kindCol[L.kind], stroke: css('--sheet'), 'stroke-width': 3, 'paint-order': 'stroke' }); t.textContent = L.label; g.append(t); }
    p.traces.forEach((tr, ti) => { let d = ''; const xs = tr.x, ys = tr.y; let pen = false;
      for (let i = 0; i < xs.length; i++) { if (xs[i] < xmin - (xmax - xmin) * .02 || xs[i] > xmax + (xmax - xmin) * .02) { pen = false; continue; }
        const yy = Math.max(y0 - 50, Math.min(y1 + 50, Y(ys[i]))); d += (pen ? 'L' : 'M') + X(xs[i]).toFixed(1) + ' ' + yy.toFixed(1); pen = true; }
      g.append(S('path', { d, fill: 'none', stroke: colors[ti % 6], 'stroke-width': 1.6, 'stroke-linejoin': 'round' })); });
    for (const m of ch.marks.filter(m => m.y != null)) { if (pi !== 0) continue; const y = Y(m.y);
      g.append(S('line', { x1: ML, x2: W - MR, y1: y, y2: y, stroke: css('--accent'), 'stroke-width': 1 }));
      const t = S('text', { x: ML + 6, y: y - 4, fill: css('--accent') }); t.textContent = '▲ ' + m.label; g.append(t); }
    const halo = { stroke: css('--sheet'), 'stroke-width': 3, 'paint-order': 'stroke' };
    const pl = S('text', { x: ML + 6, y: y0 + 13, fill: ink, 'font-weight': 500, ...halo }); pl.textContent = p.label; svg.append(pl);
    panels.push({ p, y0, y1, Y });
  });
  for (const v of niceTicks(xmin, xmax, narrow ? 4 : 8)) { const x = X(v);
    svg.append(S('line', { x1: x, x2: x, y1: yBot, y2: yBot + 4, stroke: muted }));
    const t = S('text', { x, y: yBot + 15, 'text-anchor': 'middle', fill: muted }); t.textContent = +v.toFixed(6); svg.append(t); }
  const xl = S('text', { x: W - MR, y: H - 2, 'text-anchor': 'end', fill: muted }); xl.textContent = ch.xlabel || `時間 [${ch.xunit}]`; svg.append(xl);
  const cursor = S('line', { y1: yTop, y2: yBot, stroke: ink, 'stroke-width': 1, opacity: 0 }); svg.append(cursor);
  const dots = S('g'); svg.append(dots);
  host.append(svg);
  // legend
  const leg = $('div', { class: 'legend' }); const tnow = $('span', { class: 'tnow' }, '　');
  leg.append($('div', { class: 'row' }, $('span', { class: 'pl' }, ch.xlabel ? '電源電圧' : '時刻'), tnow));
  const vals = [];
  panels.forEach(({ p }) => { const row = $('div', { class: 'row' }, $('span', { class: 'pl' }, p.label));
    p.traces.forEach((tr, ti) => { const v = $('span', { class: 'v' }, ''); vals.push({ tr, v, pan: p });
      const it = $('span', { class: 'it' }, $('i', { style: `background:${colors[ti % 6]}` }), tr.name, v); row.append(it); });
    leg.append(row); });
  host.append(leg);
  for (const { p } of panels) if (p.note) host.append($('div', { class: 'note' }, '※ ' + p.label + '：' + p.note));
  const show = (cx) => { const xv = xmin + (cx - ML) / (W - ML - MR) * (xmax - xmin);
    if (cx < ML || cx > W - MR) { cursor.setAttribute('opacity', 0); dots.innerHTML = ''; tnow.textContent = '　'; vals.forEach(o => o.v.textContent = ''); return; }
    cursor.setAttribute('x1', cx); cursor.setAttribute('x2', cx); cursor.setAttribute('opacity', .35);
    tnow.textContent = fmt(xv) + ' ' + ch.xunit; dots.innerHTML = '';
    vals.forEach(o => { const i = bsearch(o.tr.x, xv); const y = o.tr.y[i]; o.v.textContent = fmt(y); });
    panels.forEach(({ p, Y, y0, y1 }) => p.traces.forEach((tr, ti) => { const i = bsearch(tr.x, xv); const yy = Y(tr.y[i]); if (yy < y0 || yy > y1) return;
      dots.append(S('circle', { cx: X(tr.x[i]), cy: yy, r: 3, fill: colors[ti % 6] })); })); };
  const pos = e => { const r = svg.getBoundingClientRect(); return (e.clientX - r.left) * W / r.width; };
  svg.addEventListener('pointermove', e => show(pos(e)));
  svg.addEventListener('pointerdown', e => show(pos(e)));
  svg.addEventListener('pointerleave', () => show(-1));
}

function drawBars(host, b) {
  host.innerHTML = '';
  const W = Math.max(300, host.clientWidth), ML = 118, MR = 16, RH = 26, TOP = 22, H = TOP + b.items.length * RH + 26;
  const X = v => ML + v / b.max * (W - ML - MR);
  const svg = S('svg', { viewBox: `0 0 ${W} ${H}`, height: H, role: 'img', 'aria-label': b.title });
  const muted = css('--muted'), ink = css('--ink'), kindCol = { ng: css('--fail'), warn: css('--warn'), ref: css('--ref') };
  b.items.forEach((it, i) => { const y = TOP + i * RH;
    const lim = Math.max(...b.limits.map(l => l.y)), ok = it.value >= lim, bad = it.value < Math.min(...b.limits.map(l => l.y));
    const col = bad ? css('--fail') : ok ? css('--t1') : css('--warn');
    svg.append(S('rect', { x: ML, y: y + 4, width: Math.max(1, X(it.value) - ML), height: RH - 10, rx: 2, fill: col, opacity: .85 }));
    const t = S('text', { x: ML - 8, y: y + RH / 2 + 3, 'text-anchor': 'end', fill: ink }); t.textContent = it.label; svg.append(t);
    const v = S('text', { x: X(it.value) + 6, y: y + RH / 2 + 3, fill: ink }); v.textContent = fmt(it.value) + ' ' + b.unit; svg.append(v); });
  b.limits.forEach((l, i) => { const x = X(l.y);
    svg.append(S('line', { x1: x, x2: x, y1: TOP - 4, y2: TOP + b.items.length * RH, stroke: kindCol[l.kind], 'stroke-dasharray': '5 4', 'stroke-width': 1.3 }));
    const t = S('text', { x: x + 4, y: 12 + i * 0, fill: kindCol[l.kind] }); t.textContent = l.label; if (i % 2) t.setAttribute('y', H - 4); svg.append(t); });
  for (const v of niceTicks(0, b.max, 5)) { const t = S('text', { x: X(v), y: TOP + b.items.length * RH + 12, 'text-anchor': 'middle', fill: muted }); t.textContent = v; svg.append(t); }
  host.append(svg);
}

function buildSchem() {
  const host = document.getElementById('schem'), toc = document.getElementById('toc2');
  if (!DATA.schem || !DATA.schem.length) return;
  host.append($('h2', {}, '回路図'), $('p', { class: 'howto' }, '「見やすい図」は信号の流れを左→右、GNDを下にして描き直した図です。部品番号と値は回路図ファイル（pwrctrl.kicad_sch v2.4）と同じです。「KiCad原本」で実際のシートの該当部分を表示します。図は横にスクロールできます。'));

    toc.append($('a', { href: '#' + b.id }, b.title));
    const vbw = +((b.svg.match(/viewBox="[\d.]+ [\d.]+ ([\d.]+)/) || [])[1] || 900);
    const fig = $('div', { class: 'fig', role: 'img', 'aria-label': b.title }); fig.innerHTML = b.svg;
    const setw = () => { const e = fig.firstElementChild; if (e) e.style.minWidth = Math.max(720, Math.round(vbw * 0.85)) + 'px'; }; setw();
    const mk = (lab, on) => $('button', { type: 'button', 'aria-pressed': on ? 'true' : 'false' }, lab);
    const b1 = mk('見やすい図', true), b2 = mk('KiCad原本', false);
    const seg = $('div', { class: 'seg' }, b1); if (b.kicad) seg.append(b2);
    b1.onclick = () => { fig.innerHTML = b.svg; setw(); b1.setAttribute('aria-pressed', 'true'); b2.setAttribute('aria-pressed', 'false'); };
    b2.onclick = () => { fig.innerHTML = ''; fig.append($('img', { src: b.kicad, alt: b.title + '（KiCad）' })); b2.setAttribute('aria-pressed', 'true'); b1.setAttribute('aria-pressed', 'false'); };
    const rel = $('div', { class: 'rel' }, '関係する試験：');
    DATA.tests.filter(t => (t.schem || []).includes(b.id)).forEach(t => rel.append($('a', { href: '#' + t.id }, shortName(t))));
    host.append($('section', { class: 'blk', id: b.id }, $('div', { class: 'bh' }, $('h3', {}, b.title), seg), $('p', {}, b.desc), fig, rel));
  }
}
function build() {

const NAMES = { tb1_nominal: '電源シーケンス（通常）', tb1_mcufail: '電源シーケンス（マイコン停止）', tb2_sweep: '電源電圧スイープ', tb3_tja_only: 'K-Line：TJA1021のみ', tb3_parallel: 'K-Line：並列駆動', tb4_5b_35V: 'ロードダンプ：35Vに抑制', tb4_5a_87V_1R: 'ロードダンプ：87V・1Ω', tb4_5a_87V_4R: 'ロードダンプ：87V・4Ω', tb5_inrush: 'リレーの突入電流', tb6: '保持時間のばらつき', tb7: 'パルス入力（PULSE-IN）', tb8: 'DC-DC（XL7015）のスイッチング', tb9: 'I2C 400kHzの立ち上がり', tb10: 'CAN（TJA1042＋PESD1CAN）', tb11: 'GPIOの誤配線保護' };

</script>
