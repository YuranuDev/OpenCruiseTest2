# OpenCruise: systemd-backlight(前回の明るさの保存と復元)を止める。
# 前回の終了時の(暗い)明るさが起動のたびに復元され、アプリが起動するまで画面が暗くなるため。
# 明るさの保存と復元はアプリ(設定の display/brightness)が行う。
# install.sh が /etc/systemd/system/systemd-backlight@.service.d/opencruise.conf として入れる。
[Service]
ExecStart=
ExecStart=/bin/true
ExecStop=
ExecStop=/bin/true
