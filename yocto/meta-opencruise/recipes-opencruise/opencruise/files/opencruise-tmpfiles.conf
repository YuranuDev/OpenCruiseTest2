# /home が空の書き込み領域(別パーティション)でも、アプリのユーザーのフォルダを作る
d /home/opencruise 0755 opencruise opencruise -
# アプリの更新(USB・ネットから入れた版。/usr/bin/opencruise-launch が選んで起動する)
d /home/opencruise/app 0755 opencruise opencruise -
# USB メモリを読み取り専用でつなぐ場所(/usr/libexec/opencruise-usb-mount)
d /run/opencruise-usb 0755 root root -
