# OpenCruise 用の Yocto レイヤー(scripts/build-os.sh が bitbake-layers add-layer で追加する)
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "opencruise"
BBFILE_PATTERN_opencruise = "^${LAYERDIR}/"
BBFILE_PRIORITY_opencruise = "10"

# meta-oe(openembedded-layer)と meta-qt6(qt6-layer。meta-qt6 はさらに meta-python も要る)
LAYERDEPENDS_opencruise = "core openembedded-layer qt6-layer"
# 確かめているのは wrynose(Yocto 6.0 LTS)だけ
LAYERSERIES_COMPAT_opencruise = "wrynose"
