# OpenCruise 用の Yocto レイヤー(scripts/build-os.sh が bblayers.conf に追加する)
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "opencruise"
BBFILE_PATTERN_opencruise = "^${LAYERDIR}/"
BBFILE_PRIORITY_opencruise = "10"

# meta-oe(openembedded-layer)と meta-qt6(qt6-layer)が要る
LAYERDEPENDS_opencruise = "core openembedded-layer qt6-layer"
LAYERSERIES_COMPAT_opencruise = "scarthgap styhead walnascar whinlatter wrynose"
