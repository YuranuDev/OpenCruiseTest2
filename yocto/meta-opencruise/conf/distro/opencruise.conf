# OpenCruise 専用 OS のディストロ設定。local.conf の DISTRO = "opencruise" で選ぶ。
# 方針: systemd 起動、画面は eglfs(DRM/KMS)直描画なので X11 / Wayland は入れない、音は ALSA のみ(PulseAudio / PipeWire なし)。
require conf/distro/defaultsetup.conf

DISTRO = "opencruise"
DISTRO_NAME = "OpenCruise Linux"
DISTRO_VERSION = "0.1"
DISTRO_CODENAME = "cruise"
MAINTAINER = "OpenCruise"
SDK_VENDOR = "-opencruisesdk"
SDK_VERSION = "${DISTRO_VERSION}"

# 起動管理は systemd。polkit は電源オフ・再起動(ACC OFF の終了処理)を許可するために使う。
DISTRO_FEATURES:append = " systemd usrmerge pam polkit opengl alsa usbhost"
DISTRO_FEATURES:remove = "x11 wayland sysvinit pulseaudio"
DISTRO_FEATURES_BACKFILL_CONSIDERED:append = " sysvinit"
VIRTUAL-RUNTIME_init_manager = "systemd"
VIRTUAL-RUNTIME_initscripts = "systemd-compat-units"

# カーネルのコマンドライン(wic/opencruise-x86.wks.in が使う)。静かに起動して、画面のカーソルとスリープを止める。
OPENCRUISE_CMDLINE ?= "quiet loglevel=3 vt.global_cursor_default=0 consoleblank=0"
# 1 にすると読み取り専用ルート(設定・ログは /home の書き込み領域へ)。scripts/build-os.sh が local.conf で決める。
OPENCRUISE_READONLY_ROOTFS ?= "0"
