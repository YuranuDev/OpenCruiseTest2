# OpenCruise 専用 OS のディストロ設定。scripts/build-os.sh が conf/auto.conf で DISTRO = "opencruise-os" を選ぶ。
# 名前をアプリのレシピ(opencruise)と同じにしないこと: DISTRO は OVERRIDES に入るので、レシピの RDEPENDS:opencruise などが
# 「ディストロの上書き」と取り違えられ、pkgvarcheck / pn-overrides のエラーになる。
# 方針: systemd 起動、画面は eglfs(DRM/KMS)直描画なので X11 / Wayland は入れない、音は ALSA のみ(PulseAudio / PipeWire なし)。

# 起動管理は systemd(このファイルの後に bitbake.conf が defaultsetup.conf を読み、INIT_MANAGER に合わせて
# init-manager-systemd.inc を読む。ここで require すると二重に読まれる)。
# 以前の VIRTUAL-RUNTIME_* / DISTRO_FEATURES_BACKFILL_CONSIDERED の指定は、wrynose では名前が変わってエラーになるため使わない。
INIT_MANAGER = "systemd"

DISTRO = "opencruise-os"
DISTRO_NAME = "OpenCruise Linux"
DISTRO_VERSION = "0.1"
DISTRO_CODENAME = "cruise"
MAINTAINER = "OpenCruise"
SDK_VENDOR = "-opencruisesdk"
SDK_VERSION = "${DISTRO_VERSION}"

# polkit は電源オフ・再起動(ACC OFF の終了処理)をアプリのユーザーに許可するために使う。
# wifi: NetworkManager の Wi-Fi(更新をネットから取る・Wi-Fi の設定画面)
DISTRO_FEATURES:append = " systemd usrmerge pam polkit opengl alsa usbhost wifi"
# 有線 LAN も NetworkManager が受け持つ(systemd-networkd の「有線は DHCP」の既定と取り合わないように外す)
PACKAGECONFIG:remove:pn-systemd-conf = "dhcp-ethernet"
DISTRO_FEATURES:remove = "x11 wayland vulkan sysvinit pulseaudio pipewire ptest"

# カーネルのコマンドライン(files/wic/opencruise-x86.wks.in が使う)。静かに起動して、画面のカーソルとスリープを止める。
OPENCRUISE_CMDLINE ?= "quiet loglevel=3 vt.global_cursor_default=0 consoleblank=0"
# 1 にすると読み取り専用ルート(設定・ログは /home の書き込み領域へ)。scripts/build-os.sh が conf/auto.conf で決める。
OPENCRUISE_READONLY_ROOTFS ?= "0"
