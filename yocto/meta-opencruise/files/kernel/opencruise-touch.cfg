# OpenCruise: ノート PC などの実機のタッチパネルを使うためのカーネル設定(conf/layer.conf が linux-yocto / linux-intel に足す)。
# 内蔵のタッチパネルは I2C(HID over I2C)でつながっていることが多く、次がそろわないと「入力デバイス」として現れない。
#   ① GPIO・割り込み(pinctrl)  ② Intel のシリアル I/O(LPSS)の I2C  ③ i2c-hid  ④ hid-multitouch
# USB のタッチパネルは ④ と USB_HID があれば動く。すでに有効なものは、そのままで構わない(同じ値を重ねて書いているだけ)。

# --- 入力の土台とタッチスクリーン
CONFIG_INPUT=y
CONFIG_INPUT_EVDEV=y
CONFIG_INPUT_TOUCHSCREEN=y
CONFIG_HID=y
CONFIG_HID_GENERIC=y
CONFIG_HIDRAW=y
CONFIG_USB_HID=y

# --- タッチパネルの HID ドライバ(マルチタッチ。Wacom と ELAN のペン・タッチ付きの画面も)
CONFIG_HID_MULTITOUCH=m
CONFIG_HID_WACOM=m
CONFIG_HID_ELAN=m

# --- HID over I2C(内蔵のタッチパネル)
CONFIG_I2C=y
CONFIG_I2C_HID=m
CONFIG_I2C_HID_CORE=m
CONFIG_I2C_HID_ACPI=m

# --- Intel の LPSS(I2C コントローラ)
CONFIG_MFD_INTEL_LPSS=m
CONFIG_MFD_INTEL_LPSS_PCI=m
CONFIG_MFD_INTEL_LPSS_ACPI=m
CONFIG_INTEL_IDMA64=m
CONFIG_I2C_DESIGNWARE_CORE=m
CONFIG_I2C_DESIGNWARE_PLATFORM=m
CONFIG_I2C_DESIGNWARE_PCI=m

# --- GPIO・割り込み(I2C のタッチパネルの割り込み線。ここが無いと i2c-hid が最後まで読み込まれない)
# 組み込み(=y)にしておく。どの世代の Intel でも動くように、主な世代をまとめて有効にする
CONFIG_GPIOLIB=y
CONFIG_GPIO_ACPI=y
CONFIG_PINCTRL=y
CONFIG_PINCTRL_INTEL=y
CONFIG_PINCTRL_SUNRISEPOINT=y
CONFIG_PINCTRL_CANNONLAKE=y
CONFIG_PINCTRL_ICELAKE=y
CONFIG_PINCTRL_TIGERLAKE=y
CONFIG_PINCTRL_ALDERLAKE=y
CONFIG_PINCTRL_METEORLAKE=y
CONFIG_PINCTRL_JASPERLAKE=y
CONFIG_PINCTRL_ELKHARTLAKE=y
CONFIG_PINCTRL_LAKEFIELD=y
CONFIG_PINCTRL_GEMINILAKE=y
CONFIG_PINCTRL_BROXTON=y
CONFIG_PINCTRL_CHERRYVIEW=y
CONFIG_PINCTRL_BAYTRAIL=y

# --- 調べるとき用(i2cdetect など)
CONFIG_I2C_CHARDEV=m
